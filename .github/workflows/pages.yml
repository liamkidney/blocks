name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate build version
        run: |
          sed -i "s/__BUILD_ID__/${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}/g" sw.js
          sed -i "s/\";$/ · build ${GITHUB_RUN_NUMBER} · ${GITHUB_SHA::7}\";/" version.js
      - name: Build variants
        run: |
          mkdir -p _site/io
          cp index.html styles.css tetrominoes.js game.js session.js app.js multiplayer.js manifest.json sw.js version.js config.js icon.svg favicon-32.png apple-touch-icon.png icon-192.png icon-512.png _site/
          cp index.html styles.css tetrominoes.js game.js session.js app.js multiplayer.js manifest.json sw.js version.js icon.svg favicon-32.png apple-touch-icon.png icon-192.png icon-512.png _site/io/
          printf 'window.BLOCKS_CONFIG = {allowedPieces:["I","O"]};\n' > _site/io/config.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
