<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Blocks — Leaderboard Test</title>
<style>
body{font:16px system-ui,sans-serif;background:#f3efe3;color:#252525;max-width:760px;margin:30px auto;padding:0 16px}
h1{margin-bottom:4px}small{color:#666}section{background:white;padding:18px;border-radius:10px;margin:20px 0}
label{display:inline-block;margin:6px 12px 6px 0}select,button{font:inherit;padding:7px}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;border-bottom:1px solid #ddd;text-align:left}th{white-space:nowrap}
#status{min-height:1.5em} .scroll{overflow-x:auto}
</style></head><body>
<h1>Blocks — Leaderboard Test</h1>
<small>Standalone development-only page. Reads Supabase; does not alter game code or scores.</small>
<section><label>Pieces <select id="pieces"><option value="">All</option><option value="ALL">Standard</option><option value="IO">I/O only</option></select></label>
<label>Ghost <select id="ghost"><option value="">Either</option><option value="true">On</option><option value="false">Off</option></select></label>
<label>Status <select id="state"><option value="">All</option><option value="completed">Completed</option><option value="active">Active</option><option value="abandoned">Abandoned</option></select></label>
<button id="refresh">Refresh</button><p id="status" role="status">Loading…</p>
<div class="scroll"><table><thead><tr><th>#</th><th>Player</th><th>Score</th><th>Lines</th><th>Pieces</th><th>Ghost</th><th>Status</th><th>Updated</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<script>
'use strict';
const URL_BASE='https://psoncybkfsdmjksyrcvv.supabase.co/rest/v1/';
const KEY='sb_publishable_z-Aumyx5v_WMPTbY77u88A_H3oEEzFH';
const $=id=>document.getElementById(id);
function cell(row,value){const td=document.createElement('td');td.textContent=String(value);row.append(td);}
async function load(){
 $('status').textContent='Loading…';$('rows').replaceChildren();
 try{
  const headers={'apikey':KEY};
  const [pr,sr]=await Promise.all([
   fetch(URL_BASE+'players?select=player_id,display_name&limit=1000',{headers}),
   fetch(URL_BASE+'sessions?select=session_id,player_id,score,lines,pieces_mode,ghost_mode,status,updated_at&order=score.desc&limit=1000',{headers})
  ]);
  if(!pr.ok||!sr.ok)throw Error('Supabase request failed ('+pr.status+', '+sr.status+')');
  const players=new Map((await pr.json()).map(p=>[p.player_id,p.display_name]));
  let sessions=await sr.json();
  if($('pieces').value)sessions=sessions.filter(s=>s.pieces_mode===$('pieces').value);
  if($('ghost').value)sessions=sessions.filter(s=>String(s.ghost_mode)===$('ghost').value);
  if($('state').value)sessions=sessions.filter(s=>s.status===$('state').value);
  sessions.forEach((s,i)=>{const tr=document.createElement('tr');[i+1,players.get(s.player_id)??'Unknown',s.score,s.lines,s.pieces_mode,s.ghost_mode?'On':'Off',s.status,new Date(s.updated_at).toLocaleString()].forEach(v=>cell(tr,v));$('rows').append(tr);});
  $('status').textContent=sessions.length+' session(s) found';
 }catch(e){$('status').textContent='Error: '+e.message;}
}
['pieces','ghost','state'].forEach(id=>$(id).addEventListener('change',load));
$('refresh').addEventListener('click',load);load();
</script></body></html>
